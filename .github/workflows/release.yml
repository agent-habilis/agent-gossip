name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          manifest=$(cargo pkgid -p agent-habilis-swarm | sed -E 's/.*[@#]//')
          if [ "$tag" != "$manifest" ]; then
            echo "Tag v$tag does not match Cargo.toml version $manifest" >&2
            exit 1
          fi

  create-release:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub Release (idempotent)
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  upload:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ahs
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          token: ${{ secrets.GITHUB_TOKEN }}
          # Emit an `<archive>.sha256` sidecar per target so update-formula
          # can read the checksums without re-downloading the tarballs.
          checksum: sha256

  update-formula:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # commit the formula bump onto main, not the tag
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump Formula/ahs.rb to the released version + checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ver="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir /tmp --clobber
          sed -i -E "s/^  version \"[^\"]*\"/  version \"$ver\"/" Formula/ahs.rb
          for target in aarch64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            sum=$(cut -d' ' -f1 "/tmp/ahs-v$ver-$target.tar.gz.sha256")
            # Replace the sha256 line immediately following this target's url line.
            perl -0pi -e "s{(${target}\.tar\.gz\"\s*\n\s*sha256 \")[0-9a-f]{64}}{\${1}${sum}}g" Formula/ahs.rb
          done
      - name: Commit the formula bump
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ahs.rb
          git diff --cached --quiet || git commit -m "chore: update Homebrew formula for ${TAG}"
          git push origin main
