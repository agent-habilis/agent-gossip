name: release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Verify tag matches Cargo.toml version
        run: |
          tag="${TAG#v}"
          manifest=$(cargo pkgid -p agent-gossip | sed -E 's/.*[@#]//')
          if [ "$tag" != "$manifest" ]; then
            echo "Tag v$tag does not match Cargo.toml version $manifest" >&2
            exit 1
          fi

  create-release:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub Release (idempotent)
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  # The roff man pages are target-independent, so build them once here
  # (`cargo task man` generates them in-process via `clap_mangen`) and hand
  # them to every `upload` job as an artifact, rather than recompiling the
  # crate on each matrix runner. Keeps it off the per-target build path too,
  # so a host toolchain hiccup can't block a binary that cross-compiles fine.
  man-pages:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Generate roff man pages
        run: cargo task man
      - uses: actions/upload-artifact@v4
        with:
          name: man-pages
          path: target/man/

  upload:
    needs: [create-release, man-pages]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Linux rows build on a runner of their own arch, so the C in
          # the graph (`aws-lc-sys`, `ring`, `blake3`, `mimalloc`) goes
          # through the image's own gcc. No cross-compile, so the action
          # skips `cross` and its Docker image. The cost is a glibc floor:
          # these are built against the runner's 2.39, so a distro older
          # than Ubuntu 24.04 / Debian 13 cannot run them.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-26
          # The runner is Apple silicon, so this one cross-compiles. Without
          # it the formula has no `url` at all on an Intel Mac and `brew
          # install` dies on Homebrew's own internals rather than on anything
          # a user could act on.
          - target: x86_64-apple-darwin
            os: macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      # Pull the once-built man pages into ./man so the archive can bundle
      # them; Homebrew installs them from there (see Formula/agent-gossip.rb in
      # agent-habilis/homebrew-tap).
      - name: Download man pages
        uses: actions/download-artifact@v4
        with:
          name: man-pages
          path: man
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: agent-gossip
          # The root manifest is a virtual workspace, so the action cannot
          # derive the package name/version from `./Cargo.toml`.
          manifest-path: crates/agent-gossip/Cargo.toml
          target: ${{ matrix.target }}
          ref: refs/tags/${{ env.TAG }}
          archive: $bin-$tag-$target
          token: ${{ secrets.GITHUB_TOKEN }}
          # Bundle the generated man pages alongside the binary so
          # `brew install` can drop them into the man path.
          include: man
          # Emit an `<archive>.sha256` sidecar per target so update-formula
          # can read the checksums without re-downloading the tarballs.
          checksum: sha256

  update-formula:
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The formula lives only in the org tap. GITHUB_TOKEN is scoped to this
      # repo, so the push there goes through the release App.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: homebrew-tap
      - uses: actions/checkout@v5
        with:
          repository: agent-habilis/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: tap
      - name: Bump Formula/agent-gossip.rb to the released version + checksums
        working-directory: tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir /tmp --clobber
          # perl, not `sed -i -E`: BSD sed needs `-i ''` and GNU sed needs bare
          # `-i`, so a sed rewrite here runs on the CI box but dies the moment
          # anyone reproduces this step on macOS. perl's `-pi -e` is identical
          # on both, and the sha256 rewrite below already uses it.
          perl -pi -e "s/^  version \"[^\"]*\"/  version \"$ver\"/" Formula/agent-gossip.rb
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            sum=$(cut -d' ' -f1 "/tmp/agent-gossip-v$ver-$target.sha256")
            # Replace the sha256 line immediately following this target's url line.
            perl -0pi -e "s{(${target}\.tar\.gz\"\s*\n\s*sha256 \")[0-9a-f]{64}}{\${1}${sum}}g" Formula/agent-gossip.rb
          done
      - name: Push the formula to the org tap
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agent-gossip.rb
          git diff --cached --quiet || git commit -m "agent-gossip ${TAG}"
          git push
