[package]
versioned_files = [
  "crates/agent-gossip/Cargo.toml",
  { path = "Cargo.lock", dependency = "agent-gossip" },
]
changelog = "CHANGELOG.md"

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -c release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release $version\""

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: prepare release $version"

[workflows.steps.body]
template = "Merging this PR releases $version.\n\n$changelog"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

[changes]
ignore_conventional_commits = true

[github]
owner = "agent-habilis"
repo = "agent-gossip"
