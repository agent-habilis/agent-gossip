[package]
name = "iroh-multihop-transport"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "A source-routed multi-hop iroh custom transport: reach peers through relaying peers when no direct path exists."
license = "MIT"
repository = "https://github.com/agent-habilis/agent-square"
readme = "README.md"
keywords = ["iroh", "transport", "p2p", "routing", "multihop"]
categories = ["network-programming"]

[lints]
workspace = true

[dependencies]
iroh = { workspace = true, features = ["unstable-custom-transports"] }
# `CustomAddr` is not re-exported through `iroh`; name it from iroh-base
# directly. Patched to the same fork rev as `iroh` at the workspace root.
iroh-base = "1.0.1"
# The quinn fork iroh runs on. Needed directly to name `noq_udp::RecvMeta`
# in the `CustomEndpoint::poll_recv` signature. Resolves to the same
# crates.io 1.0.1 iroh depends on — no patch required.
noq-udp = "1.0.1"
n0-watcher = "1.0"
n0-future = "0.3"
tokio.workspace = true
bytes.workspace = true
tracing.workspace = true
anyhow.workspace = true
postcard = { version = "1", features = ["use-std"] }
serde.workspace = true

[dev-dependencies]
tokio = { workspace = true }
