[workspace]
members = ["tasks"]

# Shared package fields. Each crate opts in with `edition.workspace = true`
# / `rust-version.workspace = true` so the workspace stays in lockstep
# on toolchain expectations.
[workspace.package]
edition = "2024"
rust-version = "1.93"

# Note: there is NO `rust_2021_idioms` group. `rust_2018_idioms` is the only
# idioms group and is still correct on edition 2021 (it bundles
# bare_trait_objects, elided_lifetimes_in_paths, explicit_outlives_requirements,
# unused_extern_crates, ellipsis_inclusive_range_patterns).
# `rust_2021_compatibility` is a migration-only group, not used here.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
# `deny` not `forbid`: src/main.rs has one legitimate libc FFI block that
# carries a documented `#[allow(unsafe_code, reason = ...)]`.
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"
missing_debug_implementations = "warn"
# Reject non-ASCII identifiers (homoglyph / supply-chain hardening;
# matches the project's ASCII-only protocol ethos).
non_ascii_idents = "deny"
# Require an explicit `unsafe {}` block inside any `unsafe fn`.
unsafe_op_in_unsafe_fn = "deny"
# NOTE: `unused_crate_dependencies` was evaluated and rejected — it is
# per-compilation-unit, so every `tests/*.rs` integration crate
# false-flags deps it doesn't personally use (anyhow/clap/bs58/...).
# Not fixable without per-test `use X as _;` source shims. The genuine
# dead deps it surfaced (`include_dir`, `schemars`) were removed below.

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Prevents holding a sync `std::sync::Mutex` (or RwLock) guard across an
# `.await` point — a recipe for deadlocks.
await_holding_lock = "deny"
# Cargo.toml hygiene (metadata, wildcard deps, feature names, ...).
cargo = { level = "warn", priority = -1 }
# cherry-picked restriction lints that aid readability
min_ident_chars = "warn"
shadow_unrelated = "warn"
semicolon_inside_block = "warn"
allow_attributes_without_reason = "warn"
# Force `#[expect(...)]` over `#[allow(...)]` where the lint still fires, so a
# suppression that goes stale (lint no longer triggers) becomes a build error
# instead of silently lingering.
allow_attributes = "warn"
# Forbid `_ =>` catch-all arms on enum matches: a new variant must be
# handled explicitly rather than silently swallowed by a wildcard.
wildcard_enum_match_arm = "warn"
# documented opt-out (noise / not a readability win): keep CI signal useful
module_name_repetitions = "allow"
# Transitive duplicate crate versions are not controllable from a leaf
# binary (verified: ~16 dup crates, all pulled by iroh/reqwest/etc.);
# the lint is noise here, not an actionable signal.
multiple_crate_versions = "allow"

[package]
name = "agent-gossip"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "swarm network for agents"
documentation = "https://github.com/agent-habilis/agent-gossip"
license = "MIT"
repository = "https://github.com/agent-habilis/agent-gossip"
homepage = "https://github.com/agent-habilis/agent-gossip"
readme = "README.md"
keywords = ["agents", "gossip", "communication"]
categories = ["network-programming"]
exclude = [
    "TODO.md",
    "text.txt",
    "AGENTS.md",
    "CLAUDE.md",
    ".cargo/",
    ".github/",
    "Formula/",
    "claude-code-plugin/",
    "pi-extension/",
    "docs/",
    "examples/",
    "package.json",
    "proptest-regressions/",
    ".stignore",
]

[lints]
workspace = true

[lib]
name = "agent_gossip"
path = "src/lib.rs"

[[bin]]
name = "agent-gossip"
path = "src/main.rs"

[features]
# Off by default. Exposes `src/harness/bench.rs` so the divan microbenchmark
# bench can reach `pub(crate)` hot paths; never enabled in a normal or
# release build, so the public API surface is unchanged.
bench = []
# Off by default. Exposes `src/harness/adversarial.rs` + `SwarmSession::inject_raw`
# so the adversarial integration suite (`tests/adversarial.rs`) can craft and
# inject malicious wire messages a correct client never would. Never enabled in a
# normal/release build, so the public surface is unchanged. `cargo task
# test`/`ci` enable it.
adversarial = []
# Off by default. Installs dhat's heap-profiling global allocator + a profiler
# in `main`, and makes the CLI quit path return cleanly (instead of
# `process::exit`) so the profiler flushes `dhat-heap.json` on shutdown. For
# localizing the gossip-churn per-connection retention: build with this feature,
# run a churning daemon (`--active-view-capacity 5 --no-interactive`), SIGTERM
# it, inspect the profile. Never in a normal build.
dhat-heap = ["dep:dhat"]

[dependencies]
# Optional: only compiled in under the `dhat-heap` feature (heap profiling).
dhat = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "signal", "net", "process"] }
clap = { version = "4", features = ["derive"] }
# Embeds the integration artifacts (Claude Code plugin, pi extension, generic
# skill) into the binary at compile time so `agent-gossip setup` is self-contained.
include_dir = "0.7"
anstyle = "1"
anstream = "0.6"
# The shared `state`/`meta` documents are automerge CRDTs: concurrent edits
# merge without a bespoke ordered-log fold. `default-features` stays on (the
# `storage-v2` on-disk format is unused — we carry changes on the wire).
automerge = "0.10"
iroh = { version = "1.0.0-rc.0", features = ["tls-ring"] }
iroh-gossip = { version = "0.99", features = ["net"] }
# mDNS + mainline-DHT address-lookup providers were extracted from iroh core
# in the 1.0 line; these companion crates restore the `--mdns` / `--dht` legs.
iroh-mdns-address-lookup = "0.2"
iroh-mainline-address-lookup = "0.2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
# Argon2id password stretching for `--password` (swarm hash verifier + ticket
# handshake tokens). default-features off: no `password-hash` string format —
# we only need the raw `hash_password_into` KDF.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# Hidden `--password` prompt. Reads from the controlling TTY (/dev/tty), not
# stdin — `pipe listen`'s stdin is the data source — and avoids a new
# unsafe termios block. Pinned =7.4.0: it clears ECHO but leaves ICANON on,
# which is exactly the heuristic Ghostty/WezTerm/iTerm2 use to detect a
# password prompt (lock cursor + macOS secure input); 7.5+ switched to raw
# char-by-char reads (ICANON off) and silently defeats that detection.
rpassword = "=7.4.0"
governor = "0.10"
bytes = "1"
futures-util = "0.3"
bs58 = "0.5"
# End-to-end sealing of directed frames: a NaCl-style sealed box (ephemeral
# X25519 ECDH → ChaCha20-Poly1305) so only the addressed recipient can read a
# directed body. The AEAD key is derived from the ECDH secret via the in-tree
# `crypto::derive_secret` (SHA-256), so no HKDF dep. Both crates are pure-Rust
# (no `unsafe`, which the workspace denies).
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
# Best-effort wiping of retained secrets (the swarm password + derived channel
# keys) on drop, so they don't linger in process memory / core dumps.
zeroize = "1"
serde = { version = "1", features = ["derive"] }
# `raw_value` lets the MCP `fetch_messages` result embed each event's
# already-rendered, field-order-pinned JSON verbatim (a `RawValue`) instead of
# re-parsing to a key-sorted `Value` — keeping MCP byte-identical to the
# `--output json` stream.
serde_json = { version = "1", features = ["raw_value"] }
rand = "0.9"
libc = "0.2"
# PTY spawn + resize for `agent-gossip sh` (broadcast a live shell). Blocking I/O,
# bridged to tokio via reader/writer threads.
portable-pty = "0.9"
# `tracing` is already in the lockfile transitively (iroh depends on
# it); declaring it directly only lets us emit our own spans/events and
# adds nothing to the build. Pinned 0.1 (the only line; 0.x is stable).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
interprocess = { version = "2", features = ["tokio"] }
# Filesystem watcher backing the `--spool` directory transport: FSEvents on
# macOS, inotify on Linux. No debouncer companion crate — spool filenames are
# content-addressed (`sha256(frame)`), so re-delivered or coalesced events are
# idempotent and a periodic rescan covers any the OS drops.
notify = "8"
rmcp = { version = "1.5", features = ["server", "transport-io", "macros", "schemars"] }
nfsserve = "0.11.0"
async-trait = "0.1.89"
# The flag-gated (`--a2a-serve`) localhost JSON-RPC 2.0 A2A binding. All
# three are already transitive in the lockfile (via iroh/reqwest), so
# promoting them to direct deps adds zero new crates to the graph.
hyper = { version = "1", features = ["server", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }

# Compact global allocator, Linux only (see src/main.rs). Halves the daemon's
# resident memory on the static-musl fleet; on macOS the system allocator wins,
# so it is not pulled there.
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
proptest = "1.6"
insta = "1"
# In-process integration harness (`tests/common::InProcNode`) drives
# `embed::SwarmSession` async, so the test crates need a runtime + the
# `#[tokio::test]` macro. Same major as the lib dep — no new dup version.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# Offline microbenchmarks (`benches/hot_paths.rs`). No html/plotting deps;
# prints a summary table to stdout.
divan = "0.1"

# Stamps the build's git short hash + dirty flag into the version
# (`util::version::VERSION`), so every `agent-gossip` self-identifies its commit in
# `--version`, the `ready` event, and every log line. git-CLI backend — no
# libgit2/gix; build hosts all have `git`.
[build-dependencies]
vergen-gitcl = "1"

# Offline microbenchmarks of the pure hot paths. Needs `bench` for the
# `harness::bench` shim that reaches `pub(crate)` internals.
[[bench]]
name = "hot_paths"
harness = false
required-features = ["bench"]

# Two-node loopback transfer soak. Plain `fn main()` harness over the
# public `embed` API — no `bench` feature.
[[bench]]
name = "transfer"
harness = false

# Adversarial / malicious-peer integration suite. Needs `adversarial` for the
# crafted-message injector that reaches `pub(crate)` message internals; the
# default `cargo test` skips it, `cargo task test`/`ci` enable the feature.
[[test]]
name = "adversarial"
required-features = ["adversarial"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.build-override]
opt-level = 3

# Release-quality runtime perf with much faster build times — for CI and
# anywhere local "full test" runs need crypto/network speed without
# paying the fat-LTO + 1-codegen-unit price of `[profile.release]`.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16

[package.metadata.release]
publish = false
push = false
tag-name = "v{{version}}"
pre-release-commit-message = "chore: release v{{version}}"
allow-branch = ["main"]

# Local, uncommitted patch consuming the leak fixes from our GitHub forks
# (kept out of `main` until the upstream PRs merge, then dropped for the released
# versions). iroh-gossip: the connection-churn leak fix. noq: the noq-proto
# `abandoned_paths` bound — all three noq crates point at the same fork repo+branch
# because cargo resolves the noq workspace as a unit.
[patch.crates-io]
# Pinned by `rev`, not `branch`: a branch ref is mutable, so a force-push (or
# any later commit) on the fork would silently change what the next
# `cargo update` builds. The rev is the tip of the named fix branch at pin
# time; bumping a fork is an explicit rev edit here.
#
# iroh#4294 mapped_addrs eviction (drlukeangel's), from the agent-habilis fork
# (branch fix/mapped-addrs-eviction). iroh-base/iroh-dns are patched to the
# SAME repo+rev as `iroh` because the forked `iroh` pulls its workspace-local
# copies of them — without these the graph carries two `iroh_base`/`iroh_dns`
# versions (fork vs crates.io) and types from iroh-gossip/lookups clash (E0308).
iroh = { git = "https://github.com/agent-habilis/iroh", rev = "67cd78c96a8162b58c95306ab06e215bd250c893" }
iroh-base = { git = "https://github.com/agent-habilis/iroh", rev = "67cd78c96a8162b58c95306ab06e215bd250c893" }
iroh-dns = { git = "https://github.com/agent-habilis/iroh", rev = "67cd78c96a8162b58c95306ab06e215bd250c893" }
# Branch fix/superseded-conn-leak: the connection-churn leak fix.
iroh-gossip = { git = "https://github.com/agent-habilis/iroh-gossip", rev = "f7ddfcc0c32d57683fe03fcffedc8c29b025de0c" }
# Branch fix/abandoned-path-leak: the abandoned_paths bound (#683, ours) + the
# Connecting-drop fix (#682, drlukeangel's). All three crates point at the same
# repo+rev (cargo resolves the noq workspace as a unit).
noq = { git = "https://github.com/agent-habilis/noq", rev = "7a02ed23af4d5da530b18517918c84f117346814" }
noq-proto = { git = "https://github.com/agent-habilis/noq", rev = "7a02ed23af4d5da530b18517918c84f117346814" }
noq-udp = { git = "https://github.com/agent-habilis/noq", rev = "7a02ed23af4d5da530b18517918c84f117346814" }
# Branch fix/macos-corewlan-autorelease-leak: macOS CoreWLAN autorelease leak in
# os/macos/wifi.rs (CWWiFiClient queried with no autoreleasepool, via netwatch on
# every network event) — the full-mesh steady-state RSS leak. Pulled in by
# netwatch → iroh.
netdev = { git = "https://github.com/agent-habilis/netdev", rev = "c2561063f4ca3bab09070184842b1ee85efd90e8" }
