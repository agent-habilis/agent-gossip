[workspace]
members = ["tasks"]

# Shared package fields. Each crate opts in with `edition.workspace = true`
# / `rust-version.workspace = true` so the workspace stays in lockstep
# on toolchain expectations.
[workspace.package]
edition = "2024"
rust-version = "1.93"

# Note: there is NO `rust_2021_idioms` group. `rust_2018_idioms` is the only
# idioms group and is still correct on edition 2021 (it bundles
# bare_trait_objects, elided_lifetimes_in_paths, explicit_outlives_requirements,
# unused_extern_crates, ellipsis_inclusive_range_patterns).
# `rust_2021_compatibility` is a migration-only group, not used here.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
# `deny` not `forbid`: src/main.rs has one legitimate libc FFI block that
# carries a documented `#[allow(unsafe_code, reason = ...)]`.
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"
missing_debug_implementations = "warn"
# Reject non-ASCII identifiers (homoglyph / supply-chain hardening;
# matches the project's ASCII-only protocol ethos).
non_ascii_idents = "deny"
# Require an explicit `unsafe {}` block inside any `unsafe fn`.
unsafe_op_in_unsafe_fn = "deny"
# NOTE: `unused_crate_dependencies` was evaluated and rejected — it is
# per-compilation-unit, so every `tests/*.rs` integration crate
# false-flags deps it doesn't personally use (anyhow/clap/bs58/...).
# Not fixable without per-test `use X as _;` source shims. The genuine
# dead deps it surfaced (`include_dir`, `schemars`) were removed below.

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Prevents holding a sync `std::sync::Mutex` (or RwLock) guard across an
# `.await` point — a recipe for deadlocks. Add after the rate-limiter
# downgrade to tokio→std Mutex so any future drift is caught at lint time.
await_holding_lock = "deny"
# Cargo.toml hygiene (metadata, wildcard deps, feature names, ...).
cargo = { level = "warn", priority = -1 }
# cherry-picked restriction lints that aid readability
min_ident_chars = "warn"
shadow_unrelated = "warn"
semicolon_inside_block = "warn"
allow_attributes_without_reason = "warn"
# Force `#[expect(...)]` over `#[allow(...)]` where the lint still fires, so a
# suppression that goes stale (lint no longer triggers) becomes a build error
# instead of silently lingering.
allow_attributes = "warn"
# Forbid `_ =>` catch-all arms on enum matches: a new variant must be
# handled explicitly rather than silently swallowed by a wildcard.
wildcard_enum_match_arm = "warn"
# documented opt-out (noise / not a readability win): keep CI signal useful
module_name_repetitions = "allow"
# Transitive duplicate crate versions are not controllable from a leaf
# binary (verified: ~16 dup crates, all pulled by iroh/reqwest/etc.);
# the lint is noise here, not an actionable signal.
multiple_crate_versions = "allow"

[package]
name = "agent-habilis-swarm"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "swarm network for agents"
documentation = "https://github.com/agent-habilis/swarm"
license = "MIT"
repository = "https://github.com/agent-habilis/swarm"
homepage = "https://github.com/agent-habilis/swarm"
readme = "README.md"
keywords = ["agents", "gossip", "communication"]
categories = ["network-programming"]
exclude = [
    "TODO.md",
    "text.txt",
    "AGENTS.md",
    "CLAUDE.md",
    ".cargo/",
    ".github/",
    "Formula/",
    "claude-code-plugin/",
    "pi-extension/",
    "docs/",
    "examples/",
    "package.json",
    "proptest-regressions/",
    ".stignore",
]

[lints]
workspace = true

[lib]
name = "agent_habilis_swarm"
path = "src/lib.rs"

[[bin]]
name = "ahs"
path = "src/main.rs"

[features]
# Off by default. Exposes `src/bench_api.rs` so the divan microbenchmark
# bench can reach `pub(crate)` hot paths; never enabled in a normal or
# release build, so the public API surface is unchanged.
bench = []
# Off by default. Exposes `src/testkit.rs` + `SwarmSession::inject_raw` so the
# adversarial integration suite (`tests/adversarial.rs`) can craft and inject
# malicious wire messages a correct client never would. Never enabled in a
# normal/release build, so the public surface is unchanged. `cargo task
# test`/`ci` enable it.
testkit = []
# Off by default. Installs dhat's heap-profiling global allocator + a profiler
# in `main`, and makes the CLI quit path return cleanly (instead of
# `process::exit`) so the profiler flushes `dhat-heap.json` on shutdown. For
# localizing the gossip-churn per-connection retention: build with this feature,
# run a churning daemon (`--active-view-capacity 5 --no-interactive`), SIGTERM
# it, inspect the profile. Never in a normal build.
dhat-heap = ["dep:dhat"]

[dependencies]
# Optional: only compiled in under the `dhat-heap` feature (heap profiling).
dhat = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "signal", "net"] }
clap = { version = "4", features = ["derive"] }
iroh = { version = "1.0.0-rc.0", features = ["tls-ring"] }
iroh-gossip = { version = "0.99", features = ["net"] }
# mDNS + mainline-DHT address-lookup providers were extracted from iroh core
# in the 1.0 line; these companion crates restore the `--mdns` / `--dht` legs.
iroh-mdns-address-lookup = "0.2"
iroh-mainline-address-lookup = "0.2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
governor = "0.10"
bytes = "1"
futures-util = "0.3"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
libc = "0.2"
# `tracing` is already in the lockfile transitively (iroh depends on
# it); declaring it directly only lets us emit our own spans/events and
# adds nothing to the build. Pinned 0.1 (the only line; 0.x is stable).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
# iroh pulls reqwest transitively anyway; we keep our features a subset of
# iroh's so this adds nothing. No `json` (resolver.rs uses
# `serde_json::from_slice`). `rustls-no-provider` needs a provider:
# `resolver.rs::ensure_ring_provider()` installs ring.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# Only to name `rustls::crypto::ring` for that install; pinned to iroh's
# locked rustls so no duplicate.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
interprocess = { version = "2", features = ["tokio"] }
rmcp = { version = "1.5", features = ["server", "transport-io", "macros", "schemars"] }

[dev-dependencies]
proptest = "1.6"
insta = "1"
wiremock = "0.6"
# In-process integration harness (`tests/common::InProcNode`) drives
# `embed::SwarmSession` async, so the test crates need a runtime + the
# `#[tokio::test]` macro. Same major as the lib dep — no new dup version.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# Offline microbenchmarks (`benches/hot_paths.rs`). No html/plotting deps;
# prints a summary table to stdout.
divan = "0.1"

# Stamps the build's git short hash + dirty flag into the version
# (`util::version::VERSION`), so every `ahs` self-identifies its commit in
# `--version`, the `ready` event, and every log line. git-CLI backend — no
# libgit2/gix; build hosts all have `git`.
[build-dependencies]
vergen-gitcl = "1"

# Offline microbenchmarks of the pure hot paths. Needs `bench` for the
# `bench_api` shim that reaches `pub(crate)` internals.
[[bench]]
name = "hot_paths"
harness = false
required-features = ["bench"]

# Two-node loopback transfer soak. Plain `fn main()` harness over the
# public `embed` API — no `bench` feature.
[[bench]]
name = "transfer"
harness = false

# Adversarial / malicious-peer integration suite. Needs `testkit` for the
# crafted-message injector that reaches `pub(crate)` message internals; the
# default `cargo test` skips it, `cargo task test`/`ci` enable the feature.
[[test]]
name = "adversarial"
required-features = ["testkit"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.build-override]
opt-level = 3

# Release-quality runtime perf with much faster build times — for CI and
# anywhere local "full test" runs need crypto/network speed without
# paying the fat-LTO + 1-codegen-unit price of `[profile.release]`.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16

[package.metadata.release]
publish = false
push = false
tag-name = "v{{version}}"
pre-release-commit-message = "chore: release v{{version}}"
allow-branch = ["main"]

# Local, uncommitted patch consuming the leak fixes from our GitHub forks
# (kept out of `main` until the upstream PRs merge, then dropped for the released
# versions). iroh-gossip: the connection-churn leak fix. noq: the noq-proto
# `abandoned_paths` bound — all three noq crates point at the same fork repo+branch
# because cargo resolves the noq workspace as a unit.
[patch.crates-io]
# iroh#4294 mapped_addrs eviction (drlukeangel's), from the agent-habilis fork.
# iroh-base/iroh-dns are patched to the SAME repo+branch as `iroh` because the
# forked `iroh` pulls its workspace-local copies of them — without these the
# graph carries two `iroh_base`/`iroh_dns` versions (fork vs crates.io) and types
# from iroh-gossip/lookups clash (E0308).
iroh = { git = "https://github.com/agent-habilis/iroh", branch = "fix/mapped-addrs-eviction" }
iroh-base = { git = "https://github.com/agent-habilis/iroh", branch = "fix/mapped-addrs-eviction" }
iroh-dns = { git = "https://github.com/agent-habilis/iroh", branch = "fix/mapped-addrs-eviction" }
iroh-gossip = { git = "https://github.com/agent-habilis/iroh-gossip", branch = "fix/superseded-conn-leak" }
# noq fork branch carries the abandoned_paths bound (#683, ours) + the
# Connecting-drop fix (#682, drlukeangel's). All three crates point at the same
# repo+branch (cargo resolves the noq workspace as a unit).
noq = { git = "https://github.com/agent-habilis/noq", branch = "fix/abandoned-path-leak" }
noq-proto = { git = "https://github.com/agent-habilis/noq", branch = "fix/abandoned-path-leak" }
noq-udp = { git = "https://github.com/agent-habilis/noq", branch = "fix/abandoned-path-leak" }
# netdev fork: macOS CoreWLAN autorelease leak in os/macos/wifi.rs (CWWiFiClient
# queried with no autoreleasepool, via netwatch on every network event) — the
# full-mesh steady-state RSS leak. Pulled in by netwatch → iroh.
netdev = { git = "https://github.com/agent-habilis/netdev", branch = "fix/macos-corewlan-autorelease-leak" }
