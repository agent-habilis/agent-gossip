[workspace]
members = ["tasks", "agent-habilis-mesh", "examples/mesh-pipe", "iroh-multihop-transport", "slot-template"]

# Shared package fields. Each crate opts in with `edition.workspace = true`
# / `rust-version.workspace = true` so the workspace stays in lockstep
# on toolchain expectations.
[workspace.package]
edition = "2024"
rust-version = "1.93"

# Deps shared by the app (`agent-square`) and the engine
# (`agent-habilis-mesh`), pinned once here so versions stay in lockstep.
# Each crate opts in with `dep.workspace = true` (and may union in extra
# features). Feature sets here are the union across both crates — cargo
# unifies features per build anyway.
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "signal", "net", "process"] }
serde = { version = "1", features = ["derive"] }
# `raw_value` lets the MCP `fetch_messages` result embed each event's
# already-rendered, field-order-pinned JSON verbatim (a `RawValue`) instead of
# re-parsing to a key-sorted `Value` — keeping MCP byte-identical to the
# `--output json` stream.
serde_json = { version = "1", features = ["raw_value"] }
anyhow = "1"
bytes = "1"
# `tracing` is already in the lockfile transitively (iroh depends on
# it); declaring it directly only lets us emit our own spans/events and
# adds nothing to the build. Pinned 0.1 (the only line; 0.x is stable).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
async-trait = "0.1.89"
uuid = { version = "1", features = ["v4"] }
# `unstable-net-report`: 1.0.0 gated `Endpoint::net_report()` behind it, and the
# capability probe (`lookup::capability`) reads the report directly.
iroh = { version = "1.0.2", features = ["tls-ring", "unstable-net-report", "unstable-custom-transports"] }
iroh-gossip = { version = "0.101", features = ["net"] }
bs58 = "0.5"
# The shared `state`/`meta` documents are automerge CRDTs: concurrent edits
# merge without a bespoke ordered-log fold. `default-features` stays on (the
# `storage-v2` on-disk format is unused — we carry changes on the wire).
automerge = "0.10"
sha2 = "0.10"
rand = "0.9"
libc = "0.2"
# Shared dev-deps (unit + integration tests, benches).
proptest = "1.6"
insta = "1"
divan = "0.1"

# Note: there is NO `rust_2021_idioms` group. `rust_2018_idioms` is the only
# idioms group and is still correct on edition 2021 (it bundles
# bare_trait_objects, elided_lifetimes_in_paths, explicit_outlives_requirements,
# unused_extern_crates, ellipsis_inclusive_range_patterns).
# `rust_2021_compatibility` is a migration-only group, not used here.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
# `deny` not `forbid`: the engine carries a few documented libc FFI blocks,
# each with an `#[expect(unsafe_code, reason = ...)]`.
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"
missing_debug_implementations = "warn"
# Reject non-ASCII identifiers (homoglyph / supply-chain hardening;
# matches the project's ASCII-only protocol ethos).
non_ascii_idents = "deny"
# Require an explicit `unsafe {}` block inside any `unsafe fn`.
unsafe_op_in_unsafe_fn = "deny"
# NOTE: `unused_crate_dependencies` was evaluated and rejected — it is
# per-compilation-unit, so every `tests/*.rs` integration crate
# false-flags deps it doesn't personally use (anyhow/clap/bs58/...).
# Not fixable without per-test `use X as _;` source shims. The genuine
# dead deps it surfaced (`include_dir`, `schemars`) were removed below.

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Prevents holding a sync `std::sync::Mutex` (or RwLock) guard across an
# `.await` point — a recipe for deadlocks.
await_holding_lock = "deny"
# Cargo.toml hygiene (metadata, wildcard deps, feature names, ...).
cargo = { level = "warn", priority = -1 }
# cherry-picked restriction lints that aid readability
min_ident_chars = "warn"
shadow_unrelated = "warn"
semicolon_inside_block = "warn"
allow_attributes_without_reason = "warn"
excessive_nesting = "warn"
# Force `#[expect(...)]` over `#[allow(...)]` where the lint still fires, so a
# suppression that goes stale (lint no longer triggers) becomes a build error
# instead of silently lingering.
allow_attributes = "warn"
# Forbid `_ =>` catch-all arms on enum matches: a new variant must be
# handled explicitly rather than silently swallowed by a wildcard.
wildcard_enum_match_arm = "warn"
# documented opt-out (noise / not a readability win): keep CI signal useful
module_name_repetitions = "allow"
# Transitive duplicate crate versions are not controllable from a leaf
# binary (verified: ~16 dup crates, all pulled by iroh/reqwest/etc.);
# the lint is noise here, not an actionable signal.
multiple_crate_versions = "allow"

[package]
name = "agent-square"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "mesh network for agents"
documentation = "https://github.com/agent-habilis/agent-square"
license = "MIT"
repository = "https://github.com/agent-habilis/agent-square"
homepage = "https://github.com/agent-habilis/agent-square"
readme = "README.md"
keywords = ["agents", "gossip", "communication"]
categories = ["network-programming"]
exclude = [
    "TODO.md",
    "text.txt",
    "AGENTS.md",
    "CLAUDE.md",
    ".cargo/",
    ".github/",
    "Formula/",
    "docs/",
    "examples/",
    "proptest-regressions/",
    ".stignore",
]

[lints]
workspace = true

[lib]
name = "agent_square"
path = "src/lib.rs"

[[bin]]
name = "agent-square"
path = "src/main.rs"

[features]
# Off by default. Forwards to the engine's `bench` feature, which exposes its
# `pub(crate)` hot paths so `benches/hot_paths.rs` (via `harness::bench`) can
# reach them; never enabled in a normal or release build, so the public API
# surface is unchanged.
bench = ["agent-habilis-mesh/bench"]
# Off by default. Forwards to the engine's `adversarial` feature and exposes
# `src/harness/adversarial.rs` + `MeshSession::inject_raw` so the adversarial
# integration suite (`tests/adversarial.rs`) can craft and inject malicious wire
# messages a correct client never would. Never enabled in a normal/release
# build, so the public surface is unchanged. `cargo task test`/`ci` enable it.
adversarial = ["agent-habilis-mesh/adversarial"]
# Off by default. Installs dhat's heap-profiling global allocator + a profiler
# in `main`, and makes the CLI quit path return cleanly (instead of
# `process::exit`) so the profiler flushes `dhat-heap.json` on shutdown. For
# localizing the gossip-churn per-connection retention: build with this feature,
# run a churning daemon (`--active-view-capacity 5 --no-interactive`), SIGTERM
# it, inspect the profile. Never in a normal build.
dhat-heap = ["dep:dhat", "agent-habilis-mesh/dhat-heap"]

[build-dependencies]
# `build.rs` renders the multi-file `skills/` sources into the single-file
# SKILL.md tree the binary embeds; the renderer is a pure function, so a
# skill's final bytes are fixed at build time.
slot-template = { path = "slot-template" }

[dependencies]
agent-habilis-mesh = { path = "agent-habilis-mesh" }
# Optional: only compiled in under the `dhat-heap` feature (heap profiling).
dhat = { version = "0.3", optional = true }
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
# Embeds the portable Agent Skills tree into the binary at compile time so
# `agent-square plug` is self-contained.
include_dir = "0.7"
# The shared `state`/`meta` documents are automerge CRDTs: concurrent edits
# merge without a bespoke ordered-log fold. `default-features` stays on (the
# `storage-v2` on-disk format is unused — we carry changes on the wire).
automerge.workspace = true
# `unstable-net-report`: 1.0.0 gated `Endpoint::net_report()` behind it, and the
# capability probe (`lookup::capability`) reads the report directly.
iroh.workspace = true
anyhow.workspace = true
uuid.workspace = true
sha2.workspace = true
bytes.workspace = true
bs58.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rmcp = { version = "1.5", features = ["server", "transport-io", "macros", "schemars"] }
async-trait.workspace = true
# The flag-gated (`--a2a-serve`) localhost JSON-RPC 2.0 A2A binding. All
# three are already transitive in the lockfile (via iroh/reqwest), so
# promoting them to direct deps adds zero new crates to the graph.
hyper = { version = "1", features = ["server", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }

# Compact global allocator, Linux only (see src/main.rs). Halves the daemon's
# resident memory on the static-musl fleet; on macOS the system allocator wins,
# so it is not pulled there.
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
# Enable the engine's `test-fixtures` feature for test/bench builds only, so the
# app's test suites can build the engine's cross-crate test fixtures. Off for a
# normal `cargo build` (dev-deps don't apply there).
agent-habilis-mesh = { path = "agent-habilis-mesh", features = ["test-fixtures"] }
proptest.workspace = true
insta.workspace = true
# In-process integration harness (`tests/common::InProcNode`) drives
# `embed::MeshSession` async, so the test crates need a runtime + the
# `#[tokio::test]` macro. Same major as the lib dep — no new dup version.
tokio.workspace = true
# Offline microbenchmarks (`benches/hot_paths.rs`). No html/plotting deps;
# prints a summary table to stdout.
divan.workspace = true

# Offline microbenchmarks of the pure hot paths. Needs `bench` for the
# `harness::bench` shim that reaches `pub(crate)` internals.
[[bench]]
name = "hot_paths"
harness = false
required-features = ["bench"]

# Two-node loopback transfer soak. Plain `fn main()` harness over the
# public `embed` API — no `bench` feature.
[[bench]]
name = "transfer"
harness = false

# Adversarial / malicious-peer integration suite. Needs `adversarial` for the
# crafted-message injector that reaches `pub(crate)` message internals; the
# default `cargo test` skips it, `cargo task test`/`ci` enable the feature.
[[test]]
name = "adversarial"
required-features = ["adversarial"]

# Dependencies get light optimization in dev/test builds; workspace members
# stay at opt-level 0 (`package."*"` never applies to them) so incremental
# builds stay fast. Debug-built curve/AEAD/hash math is ~10x slower and
# inflates every connect/handshake in the subprocess test suite, so the hot
# crypto crates get full optimization. `ring` needs no entry (C/asm core).
[profile.dev.package."*"]
opt-level = 1

[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.x25519-dalek]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.build-override]
opt-level = 3

# Release-quality runtime perf with much faster build times — for CI and
# anywhere local "full test" runs need crypto/network speed without
# paying the fat-LTO + 1-codegen-unit price of `[profile.release]`.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16

[package.metadata.release]
publish = false
push = false
tag-name = "v{{version}}"
pre-release-commit-message = "chore: release v{{version}}"
allow-branch = ["main"]

# Local, uncommitted patch consuming the leak fixes from our GitHub forks
# (kept out of `main` until the upstream PRs merge, then dropped for the released
# versions). iroh-gossip: the connection-churn leak fix. The former noq patch
# (abandoned_paths bound, #683) is gone — noq v1.0.1 bounds the set upstream
# via ArrayRangeSet (noq#691); the former netdev patch (CoreWLAN autorelease
# leak) merged upstream (netdev#165, shipped in 0.44.0, pulled as 0.45.x via
# netwatch 0.19.1).
[patch.crates-io]
# Pinned by `rev`, not `branch`: a branch ref is mutable, so a force-push (or
# any later commit) on the fork would silently change what the next
# `cargo update` builds. The rev is the tip of the named fix branch at pin
# time; bumping a fork is an explicit rev edit here.
#
# iroh#4294 mapped_addrs eviction (drlukeangel's), from the agent-habilis fork
# (branch fix/mapped-addrs-eviction-1.0.2, rebased onto v1.0.2). iroh-base/
# iroh-dns are patched to the SAME repo+rev as `iroh` because the forked `iroh`
# pulls its workspace-local copies of them — without these the graph carries
# two `iroh_base`/`iroh_dns` versions (fork vs crates.io) and types from
# iroh-gossip/lookups clash (E0308).
iroh = { git = "https://github.com/agent-habilis/iroh", rev = "dcbdc1521caf680d483b2d8eec669a7997e9edf3" }
iroh-base = { git = "https://github.com/agent-habilis/iroh", rev = "dcbdc1521caf680d483b2d8eec669a7997e9edf3" }
iroh-dns = { git = "https://github.com/agent-habilis/iroh", rev = "dcbdc1521caf680d483b2d8eec669a7997e9edf3" }
# Branch fix/superseded-conn-leak-0.101 (rebased onto v0.101.0): the
# connection-churn leak fix (upstream PR n0-computer/iroh-gossip#147).
iroh-gossip = { git = "https://github.com/agent-habilis/iroh-gossip", rev = "c779c0661fc9429e86852570be9bdc00fb47fdd9" }
