[workspace]
members = ["crates/*"]
# The browser client builds for wasm32 and nowhere else — `web_sys::window()`
# does not exist off it, and `habilis-network` selects the *native* WebRTC backend on a
# host target, so a host build cannot type-check by construction. Left in
# `members` (which `crates/*` would do), every unscoped host build would fail on
# it. It carries its own `[workspace]` table and its own lockfile.
exclude = ["crates/agent-gossip-wasm-client"]
# Load-bearing on a *virtual* manifest: a root package on edition 2024 implies
# `resolver = "3"`, but a virtual workspace inherits nothing from its members
# and silently defaults to the edition-2015 `resolver = "1"`. Left implicit, the
# split from root-package to virtual would quietly change feature unification
# across the whole graph — notably folding the `test-fixtures` dev-dep feature
# into the shipped binary.
resolver = "3"
# Also load-bearing on a virtual manifest: with no root package, an unscoped
# `cargo build`/`test`/`clippy`/`run` defaults to *every* member instead of the
# app. This pins the pre-split meaning. Widening coverage to the whole workspace
# is a deliberate follow-up (drop this key), not a side effect of the move.
default-members = ["crates/agent-gossip"]

# Shared package fields. Each crate opts in with `edition.workspace = true`
# / `rust-version.workspace = true` so the workspace stays in lockstep
# on toolchain expectations.
[workspace.package]
edition = "2024"
rust-version = "1.93"

# Deps shared across the app's crates, pinned once here so versions stay in
# lockstep. Each crate opts in with `dep.workspace = true` (and may union in
# extra features).
[workspace.dependencies]
# The gossip-network engine, developed in its own repo and shared with
# agent-share and mallorca.
#
# Pinned by **rev**, not a path to a sibling checkout. The path dep was faster to
# iterate on — no push-and-bump round trip when the engine and this repo change
# together — but it made "which habilis-network is this built against?" unanswerable
# except by looking at what happened to be on disk. A rev states it, so every
# consumer can be checked for agreement instead of assumed to agree.
#
# The cost is real and deliberate: an engine change is now push-then-bump here.
# That is the trade, not an oversight — don't quietly restore the path dep.
#
# Bumping this is what carries an engine fix into the app; keep it in step with
# agent-share, which pins the same rev.
habilis-network = { git = "https://github.com/agent-habilis/habilis-network", rev = "f66a24335657a315e0427649c5b8d7e804b135ab" }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "io-util",
  "fs",
  "signal",
  "net",
  "process",
] }
serde = { version = "1", features = ["derive"] }
# `raw_value` lets the MCP `fetch_messages` result embed each event's
# already-rendered, field-order-pinned JSON verbatim (a `RawValue`) instead of
# re-parsing to a key-sorted `Value` — keeping MCP byte-identical to the
# `--output json` stream.
serde_json = { version = "1", features = ["raw_value"] }
anyhow = "1"
bytes = "1"
# Cargo-style colored status output for the operator-facing commands (`plug`,
# `unplug`, `doctor`). `anstream` resolves color support per stream at write
# time — a pipe, a file or `NO_COLOR` gets plain bytes — so an agent capturing
# stdout sees no ANSI without us branching on a flag or a TTY check.
anstyle = "1"
anstream = "1"
# `tracing` is already in the lockfile transitively (iroh depends on
# it); declaring it directly only lets us emit our own spans/events and
# adds nothing to the build. Pinned 0.1 (the only line; 0.x is stable).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "tracing-log",
] }
async-trait = "0.1.89"
# `FuturesUnordered` runs the per-connection futures of an accept loop on the loop's own
# task, so they borrow the loop's context instead of holding an `Arc` of it.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
uuid = { version = "1", features = ["v4"] }
# NOTE: no `iroh` entry, deliberately. This workspace names nothing from the
# iroh family; `habilis_network::iroh` is the only door, and `habilis-network` owns which fork and
# revision that is. Declaring iroh here would resolve the *published* crate
# alongside the engine's fork — two `iroh` crates in one graph, surfacing as an
# E0308 between types that look identical, and it would put this repo back in
# the business of tracking revs it has no reason to know.
bs58 = "0.5"
# The shared `state`/`meta` documents are automerge CRDTs: concurrent edits
# merge without a bespoke ordered-log fold. `default-features` stays on (the
# `storage-v2` on-disk format is unused — we carry changes on the wire).
automerge = "0.10"
sha2 = "0.10"
rand = "0.9"
libc = "0.2"
# Shared dev-deps (unit + integration tests, benches).
proptest = "1.6"
insta = "1"
divan = "0.1"

# Note: there is NO `rust_2021_idioms` group. `rust_2018_idioms` is the only
# idioms group and is still correct on edition 2021 (it bundles
# bare_trait_objects, elided_lifetimes_in_paths, explicit_outlives_requirements,
# unused_extern_crates, ellipsis_inclusive_range_patterns).
# `rust_2021_compatibility` is a migration-only group, not used here.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
# `deny` not `forbid`: the engine carries a few documented libc FFI blocks,
# each with an `#[expect(unsafe_code, reason = ...)]`.
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"
missing_debug_implementations = "warn"
# Google Rust Style Guide D1: every public item states its contract.
missing_docs = "warn"
# Reject non-ASCII identifiers (homoglyph / supply-chain hardening;
# matches the project's ASCII-only protocol ethos).
non_ascii_idents = "deny"
# Google Rust Style Guide D12: `///` documents an item, `//` holds a note. A `///` on a statement,
# an expression or a match arm is an error here, not a warning. A misplaced `//!` or a `///` at the
# end of a block is already a compiler error.
unused_doc_comments = "deny"
# Require an explicit `unsafe {}` block inside any `unsafe fn`.
unsafe_op_in_unsafe_fn = "deny"
# NOTE: `unused_crate_dependencies` was evaluated and rejected — it is
# per-compilation-unit, so every `tests/*.rs` integration crate
# false-flags deps it doesn't personally use (anyhow/clap/bs58/...).
# Not fixable without per-test `use X as _;` source shims. The genuine
# dead deps it surfaced (`include_dir`, `schemars`) were removed below.

# Google Rust Style Guide D10 and D11: the rustdoc lints that judge a doc comment. `deny`, because
# `cargo task ci` and the CI doc job run `cargo doc` with `-D warnings` and a lint level of `warn`
# would hide behind the flag. `private_intra_doc_links` and `redundant_explicit_links` are `warn` by
# default; the other four are `allow` by default or only `warn` for a part of their cases.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "deny"
invalid_rust_codeblocks = "deny"
invalid_codeblock_attributes = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Prevents holding a sync `std::sync::Mutex` (or RwLock) guard across an
# `.await` point — a recipe for deadlocks.
await_holding_lock = "deny"
# Cargo.toml hygiene (metadata, wildcard deps, feature names, ...).
cargo = { level = "warn", priority = -1 }
# cherry-picked restriction lints that aid readability
min_ident_chars = "warn"
shadow_unrelated = "warn"
semicolon_inside_block = "warn"
allow_attributes_without_reason = "warn"
excessive_nesting = "warn"
# Google Rust Style Guide, B3: a clone is a copy that is needed, and `Arc::clone(&x)` shows that it
# only bumps a count.
clone_on_ref_ptr = "warn"
# Google Rust Style Guide, U23: a public enum is non_exhaustive, so a new variant is not a breaking change.
exhaustive_enums = "warn"
# Google Rust Style Guide, U26: a public struct with public fields is non_exhaustive, so a new field is not a breaking change.
exhaustive_structs = "warn"
# Google Rust Style Guide, O27: import the type or the parent module; a path names at most three segments (clippy.toml).
absolute_paths = "warn"
redundant_clone = "warn"
# Google Rust Style Guide, B5: do not clone out of habit; borrow, move, or restructure.
implicit_clone = "warn"
map_clone = "warn"
cloned_instead_of_copied = "warn"
assigning_clones = "warn"
unnecessary_to_owned = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
# Force `#[expect(...)]` over `#[allow(...)]` where the lint still fires, so a
# suppression that goes stale (lint no longer triggers) becomes a build error
# instead of silently lingering.
allow_attributes = "warn"
# Forbid `_ =>` catch-all arms on enum matches: a new variant must be
# handled explicitly rather than silently swallowed by a wildcard.
wildcard_enum_match_arm = "warn"
undocumented_unsafe_blocks = "warn"
# Google Rust Style Guide D10 and D11: the first paragraph of a doc comment is a short summary
# (`doc_markdown`, `doc_link_with_quotes`, `doc_lazy_continuation` and `empty_docs` already run).
too_long_first_doc_paragraph = "warn"
doc_include_without_cfg = "warn"
string_add = "warn"
unwrap_used = "warn"
# 38 crates have two or more versions in Cargo.lock (checked with `cargo clippy --workspace
# --all-targets`), and the app cannot remove any of them: each one is forced by an upstream
# dependency, so `-D warnings` would fail on a lint with no fix here. The app already moved its
# own `anstream` to 1, which removed `anstream` and `anstyle-parse`. The rest, by cause:
# - RustCrypto 0.10 against 0.11 (`habilis-network` and `dimpl` use 0.10, `iroh-base` and
#   `automerge` use 0.11): base16ct, block-buffer, chacha20, const-oid, cpufeatures,
#   crypto-common, curve25519-dalek, der, digest, fiat-crypto, pem-rfc7468, pkcs8, sha2,
#   signature, spki.
# - rand 0.9 (`habilis-network`, `dimpl`, `sctp-proto`) against 0.10 (`iroh`, `automerge`,
#   `hickory`): rand, rand_core, getrandom, r-efi.
# - `netdev` (through `jni` 0.21, `thiserror` 1 and `windows-sys` 0.45) against
#   `rustls-platform-verifier` and `hickory`: jni, jni-sys, thiserror, thiserror-impl,
#   windows-sys, windows-targets and the windows_* target crates, core-foundation (against
#   `security-framework`).
# - `heapless` 0.7 (embedded-io 0.4, spin 0.9) against `postcard` and `futures-buffered`
#   (embedded-io 0.6, spin 0.10): embedded-io, spin.
# - nom 7 against 8 (`dimpl`), smol_str 0.1 (`acto`) against 0.3 (`automerge`), untrusted 0.7
#   against 0.9 (`ring`, `rustls-webpki`): nom, smol_str, untrusted.
# Remove this row when the engine and the iroh fork move to one generation.
multiple_crate_versions = "allow"

# Dependencies get light optimization in dev/test builds; workspace members
# stay at opt-level 0 (`package."*"` never applies to them) so incremental
# builds stay fast. Debug-built curve/AEAD/hash math is ~10x slower and
# inflates every connect/handshake in the subprocess test suite, so the hot
# crypto crates get full optimization. `ring` needs no entry (C/asm core).
[profile.dev.package."*"]
opt-level = 1

[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.x25519-dalek]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.build-override]
opt-level = 3

# Release-quality runtime perf with much faster build times — for CI and
# anywhere local "full test" runs need crypto/network speed without
# paying the fat-LTO + 1-codegen-unit price of `[profile.release]`.
#
# `lto = false`, not `"thin"`: what this profile is *for* is fast crypto and
# network paths, and that comes from `opt-level = 3` — LTO only trims the
# cross-crate seams on top. But the thing being built is ~20 integration-test
# binaries, and each one links the whole iroh/QUIC/DHT graph, so thin LTO is
# paid once per binary. On a 4-core CI runner that alone was 29 minutes with
# every dependency already cached, which overran the job's cap and got the run
# cancelled mid-suite. `codegen-units = 256` (the non-LTO default) then buys
# back the codegen parallelism `16` was giving up for LTO's sake.
#
# `strip = false` overrides the inherited `true`: stripped test binaries make
# every CI panic backtrace a bare "details are omitted" stub, which is exactly
# the diagnostic needed when a reliability test fails only on the runner.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 256
strip = false
