[toolchain]
# Single source of truth for the toolchain on every env (local + CI).
# Pinned by date: rustfmt.toml needs unstable options, which only nightly
# rustfmt honours, and those options change between nightlies. CI reads this
# file via actions-rust-lang/setup-rust-toolchain — do not duplicate the
# version in the workflows.
channel = "nightly-2026-06-05"
components = ["clippy", "rustfmt"]
profile = "minimal"
