[package]
name = "agent-square-test-fixtures"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "shared harness for the agent-square integration suites"
documentation = "https://github.com/agent-habilis/agent-square"
license = "MIT"
repository = "https://github.com/agent-habilis/agent-square"
homepage = "https://github.com/agent-habilis/agent-square"
readme = "../../README.md"
keywords = ["agents", "gossip", "testing"]
categories = ["development-tools::testing"]
# Never leaves the workspace: it exists only so the integration binaries share
# one harness. Publishing `agent-square` must not drag it along.
publish = false

[lints]
workspace = true

[dependencies]
# The harness drives the app's *public* surface only (`api`, `a2a::gossip`,
# `mesh_prefix`, `runtime_base`, `event_json`) — never a `pub(crate)` internal.
# `agent-square` in turn dev-depends on this crate; cargo permits the cycle
# because the back-edge is a dev-dependency, and this is the standard shape of
# a fixtures crate.
agent-square = { path = "../agent-square" }
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
