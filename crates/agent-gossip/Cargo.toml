[package]
name = "agent-gossip"
version = "0.7.4"
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "mesh network for agents"
documentation = "https://github.com/agent-habilis/agent-gossip"
license = "MIT"
repository = "https://github.com/agent-habilis/agent-gossip"
homepage = "https://github.com/agent-habilis/agent-gossip"
readme = "../../README.md"
keywords = ["agents", "gossip", "communication"]
categories = ["network-programming"]

[lints]
workspace = true

[lib]
name = "agent_gossip"
path = "src/lib.rs"

[[bin]]
name = "agent-gossip"
path = "src/main.rs"

[features]
# Off by default. Exposes `src/harness/bench.rs` so `benches/hot_paths.rs` can
# build its fixtures; never enabled in a normal or release build, so the public
# API surface is unchanged. Forwards to the engine's `test-fixtures` (not a
# `bench` feature of its own — the engine gates no hot path on one).
bench = ["agent-habilis-mesh/test-fixtures"]
# Off by default. Forwards to the engine's `adversarial` feature and exposes
# `src/harness/{adversarial,session}.rs` — the crafted-message injector and the
# `MeshSession` testkit — so the adversarial suite (`tests/adversarial.rs`) can
# inject malicious wire messages a correct client never would. The testkit lives
# in `harness`, not `api`, so the feature cannot widen the public surface (nor
# put an `iroh` type on it). `cargo task test`/`ci` enable it.
adversarial = ["agent-habilis-mesh/adversarial"]
# Off by default. Installs dhat's heap-profiling global allocator + a profiler
# in `main`, and makes the CLI quit path return cleanly (instead of
# `process::exit`) so the profiler flushes `dhat-heap.json` on shutdown. For
# localizing the gossip-churn per-connection retention: build with this feature,
# run a churning daemon (`--active-view-capacity 5`), SIGTERM it, inspect the
# profile. Never in a normal build.
dhat-heap = ["dep:dhat", "agent-habilis-mesh/dhat-heap"]

[build-dependencies]
# `build.rs` renders the multi-file `skills/` sources into the single-file
# SKILL.md tree the binary embeds; the renderer is a pure function, so a
# skill's final bytes are fixed at build time.
slot-template = { path = "../slot-template" }

[dependencies]
agent-habilis-mesh = { path = "../agent-habilis-mesh" }
# Optional: only compiled in under the `dhat-heap` feature (heap profiling).
dhat = { version = "0.3", optional = true }
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
# Embeds the portable Agent Skills tree into the binary at compile time so
# `agent-gossip plug` is self-contained.
include_dir = "0.7"
# `unstable-net-report`: 1.0.0 gated `Endpoint::net_report()` behind it, and the
# capability probe (`lookup::capability`) reads the report directly.
iroh.workspace = true
anyhow.workspace = true
uuid.workspace = true
sha2.workspace = true
bytes.workspace = true
bs58.workspace = true
serde.workspace = true
serde_json.workspace = true
# `doctor`'s human report — the one operator-facing renderer in the binary.
anstyle.workspace = true
anstream.workspace = true
rand.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rmcp = { version = "1.5", features = ["server", "transport-io", "macros", "schemars"] }
async-trait.workspace = true
# The flag-gated (`--a2a-serve`) localhost JSON-RPC 2.0 A2A binding. All
# three are already transitive in the lockfile (via iroh/reqwest), so
# promoting them to direct deps adds zero new crates to the graph.
hyper = { version = "1", features = ["server", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }

# Compact global allocator, Linux only (see src/main.rs). Halves the daemon's
# resident memory on the static-musl fleet; on macOS the system allocator wins,
# so it is not pulled there.
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
# Enable the engine's `test-fixtures` feature for test/bench builds only, so the
# app's test suites can build the engine's cross-crate test fixtures. Off for a
# normal `cargo build` (dev-deps don't apply there).
agent-habilis-mesh = { path = "../agent-habilis-mesh", features = ["test-fixtures"] }
# The shared harness the 16 integration binaries drive (`InProcNode`, `Node`, the
# `cli_*` helpers). A crate rather than a `tests/common/` module because each
# binary is its own compilation unit: as a module, every helper a binary did not
# personally call looked dead, which forced a blanket `#![allow(dead_code)]` that
# also hid genuinely dead helpers. A library's `pub` surface is exempt from the
# lint. The dependency cycle (it depends on `agent-gossip`) is legal precisely
# because this back-edge is a dev-dependency.
agent-gossip-test-fixtures = { path = "../agent-gossip-test-fixtures" }
proptest.workspace = true
insta.workspace = true
# The in-process harness (`agent_gossip_test_fixtures::InProcNode`) drives
# `api::MeshSession` async, so the test crates need a runtime + the
# `#[tokio::test]` macro. Same major as the lib dep — no new dup version.
tokio.workspace = true
# Offline microbenchmarks (`benches/hot_paths.rs`). No html/plotting deps;
# prints a summary table to stdout.
divan.workspace = true

# Offline microbenchmarks of the pure hot paths. Needs `bench` for the
# `harness::bench` shim that reaches `pub(crate)` internals.
[[bench]]
name = "hot_paths"
harness = false
required-features = ["bench"]

# Two-node loopback transfer soak. Plain `fn main()` harness over the
# public `api` surface — no `bench` feature.
[[bench]]
name = "transfer"
harness = false

# Adversarial / malicious-peer integration suite. Needs `adversarial` for the
# crafted-message injector that reaches `pub(crate)` message internals; the
# default `cargo test` skips it, `cargo task test`/`ci` enable the feature.
[[test]]
name = "adversarial"
required-features = ["adversarial"]

[package.metadata.release]
publish = false
push = false
tag-name = "v{{version}}"
pre-release-commit-message = "chore: release v{{version}}"
allow-branch = ["main"]
