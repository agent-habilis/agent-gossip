# Standalone workspace on purpose, and `exclude`d from the root: this crate
# builds for wasm32 and nowhere else, so an unscoped `cargo build` at the root
# would fail on it. It also keeps `web-sys` out of the host lockfile.
[package]
name = "agent-gossip-wasm-client"
version = "0.1.0"
edition = "2024"
description = "Browser gossip peer for agent-gossip: A2A over a WebRTC data channel"
license = "MIT"
publish = false

[workspace]

[lib]
# `rlib` so pure logic can be unit-tested; `cdylib` is what wasm-bindgen loads.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engine, portable half only: `host` pulls in signals, the control socket
# and the filesystem, none of which exist in a tab.
habilis-network = { git = "https://github.com/agent-habilis/habilis-network", rev = "6d698d054d7e6b903cd1b858ba9dd420ba3c08a1", default-features = false, features = ["multihop"] }
habilis-network-iroh-webrtc-transport = { git = "https://github.com/agent-habilis/habilis-network", rev = "6d698d054d7e6b903cd1b858ba9dd420ba3c08a1", features = ["web"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
# Not named in the source: the `wasm_bindgen` macro expands an `async fn` to a call into it.
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
n0-future = "0.3"
async-trait = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
